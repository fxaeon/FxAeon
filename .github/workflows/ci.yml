name: Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/mini-app exec playwright install --with-deps chromium
      - name: Run source verification
        run: pnpm verify --ci-source
        env:
          NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/ci-placeholder
          NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL: https://base-mainnet.g.alchemy.com/v2/ci-placeholder
          NEXT_PUBLIC_TELEGRAM_APP_URL: https://t.me/FxAeonBot

  build:
    name: Production build checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mini-app/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mini-app/next.config.*', 'apps/mini-app/package.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mini-app/next.config.*', 'apps/mini-app/package.json') }}-
      - run: pnpm install --frozen-lockfile
      - name: Build once and run built artifact checks
        run: pnpm verify --ci-build
        env:
          NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/ci-placeholder
          NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL: https://base-mainnet.g.alchemy.com/v2/ci-placeholder
          NEXT_PUBLIC_TELEGRAM_APP_URL: https://t.me/FxAeonBot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mini-app-static-export
          path: apps/mini-app/dist
          if-no-files-found: error
          retention-days: 1

  built-e2e:
    name: Built E2E shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: mini-app-static-export
          path: apps/mini-app/dist
      - run: pnpm --dir apps/mini-app exec playwright install --with-deps chromium
      - name: Run built route browser shard
        run: pnpm --dir apps/mini-app exec playwright test --shard=${{ matrix.shard }}
        env:
          E2E_BUILD: '0'

  isolated-e2e:
    name: Isolated browser group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: ['ci-isolated-0', 'ci-isolated-1', 'ci-isolated-2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/mini-app exec playwright install --with-deps chromium
      - name: Run isolated browser checks
        run: pnpm verify --${{ matrix.group }}

  verify:
    name: Scope, lint, typecheck, test, build
    if: ${{ always() }}
    needs: [source, build, built-e2e, isolated-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification phase
        if: ${{ needs.source.result != 'success' || needs.build.result != 'success' || needs.built-e2e.result != 'success' || needs.isolated-e2e.result != 'success' }}
        run: |
          echo "Source: ${{ needs.source.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Built E2E: ${{ needs.built-e2e.result }}"
          echo "Isolated E2E: ${{ needs.isolated-e2e.result }}"
          exit 1
      - name: All verification phases passed
        if: ${{ needs.source.result == 'success' && needs.build.result == 'success' && needs.built-e2e.result == 'success' && needs.isolated-e2e.result == 'success' }}
        run: echo "All verification phases passed"