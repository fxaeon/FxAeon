name: Mini App E2E

# Pull requests and main pushes run this suite in shards through Client CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/mini-app exec playwright install --with-deps chromium
      - name: Build browser-only static export once
        run: pnpm build
        env:
          NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/e2e-placeholder
          NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL: https://base-mainnet.g.alchemy.com/v2/e2e-placeholder
          NEXT_PUBLIC_TELEGRAM_APP_URL: https://t.me/FxAeonBot
      - name: Run browser and Telegram viewport tests
        run: pnpm test:e2e
        env:
          # The static export above is reused. This prevents Playwright's
          # webServer from spending the whole test startup budget rebuilding
          # Next on every CI run.
          E2E_BUILD: '0'
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/mini-app/playwright-report
          retention-days: 7
