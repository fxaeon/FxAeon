packages:
  - 'apps/landing'
  - 'apps/mini-app'

allowBuilds:
  '@reown/appkit': true
  bufferutil: true
  es5-ext: true
  esbuild: true
  keccak: true
  msgpackr-extract: true
  sharp: true
  utf-8-validate: true
  workerd: true

minimumReleaseAgeExclude:
  # Preserve the existing Miniflare/Wrangler age-policy exceptions; Undici is pinned separately below.
  - miniflare@5.20260926.1-alpha
  - wrangler@4.144.0

# pnpm 10+ reads workspace-wide dependency policies from this file. Keeping
# security overrides here also makes frozen installs match pnpm-lock.yaml.
overrides:
  'axios@>=1.0.0 <1.20.0': '1.20.0'
  'body-parser@<1.20.6': '1.20.6'
  'brace-expansion@>=1.0.0 <1.1.21': '1.1.21'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.12'
  browserslist: '4.28.8'
  decode-uri-component: '0.5.0'
  # GHSA-jggr-w7fw-pc2j: stack exhaustion on deeply nested values (pino-pretty under Privy).
  'fast-copy@>=3.0.0 <3.1.0': '3.1.0'
  'fast-uri@<3.1.5': '3.1.5'
  # GHSA-q3jh-wrc6-jgq8 and GHSA-8r9p-f939-6h3c: redirect header handling.
  'follow-redirects@<1.16.1': '1.16.1'
  'tsx>esbuild': '0.28.1'
  'form-data@>=4.0.0 <4.0.6': '>=4.0.6'
  hono: '4.13.11'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'nanoid@<3.3.18': '3.3.18'
  # GHSA-wq5f-xc86-pv6w: librsvg CVE-2026-96889 bundled with sharp < 0.35.5.
  'next>sharp': '0.35.5'
  'miniflare>sharp': '0.35.5'
  postcss: '8.5.30'
  # 6.1.4 preserves Tailwind 3 group-*/peer-* variants; 6.1.5 adds the
  # GHSA-rj75-hqrm-r3gf linear-time parsing fix on the compatible 6.x line.
  postcss-selector-parser: '6.1.5'
  socket.io-parser: '4.2.7'
  # GHSA-68fv-2mgg-jv7q: event-loop DoS through indexed source-map section offsets (postcss).
  'source-map-js@<1.2.2': '1.2.2'
  # GHSA-mrhx-c7xc-m3w5: keep Zod 3 consumers on the compatible patched 3.x line.
  'zod@3.22.4': '3.25.76'
  # GHSA-mrhx-c7xc-m3w5: patch Zod 4 without replacing consumers' Zod 3 API.
  'zod@4.4.3': '4.6.7'
  use-sync-external-store: '1.6.0'
  'uuid@<11.1.1': '11.1.1'
  # GHSA-xjj6-f33q-929c and related Undici 7.x advisories are fixed in 7.30.1.
  undici: '7.30.1'
  ws: '8.21.3'

patchedDependencies:
  '@aladdindao/fx-sdk@1.0.5': patches/@aladdindao__fx-sdk@1.0.5.patch
  '@privy-io/react-auth@3.45.0': patches/@privy-io__react-auth@3.45.0.patch
  braces@3.0.3: patches/braces@3.0.3.patch
  query-string@7.1.3: patches/query-string@7.1.3.patch
  zod@3.25.76: patches/zod@3.25.76.patch
  zod@4.6.7: patches/zod@4.6.7.patch

peerDependencyRules:
  # ws 7's optional native accelerator is API-compatible with v6; pnpm's
  # strict peer checker otherwise flags the transitive WalletConnect pairing.
  allowedVersions:
    utf-8-validate: '*'
    ws: '*'
