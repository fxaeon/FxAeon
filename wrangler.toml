# Static Cloudflare Pages configuration. Deploy the exported directory with
# `wrangler pages deploy apps/mini-app/dist --project-name=fxaeon`;
# `wrangler deploy` is a Worker command and is not valid for this workspace.
name = "fxaeon"
compatibility_date = "2026-06-09"
pages_build_output_dir = "apps/mini-app/dist"

[[d1_databases]]
binding = "ADMISSION_DB"
database_name = "fxaeon-admission"
database_id = "056c44dd-4524-4b49-ab64-80ae1e53c4b7"

# Preview builds must never reserve seats in the production cohort.
[env.preview]
d1_databases = []
